version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roxxstar-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/roxxstar
      - JWT_SECRET=roxxstar_production_secure_secret_key_2026
    depends_on:
      - mongo
    restart: unless-stopped
    volumes:
      - audio-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  mongo:
    image: mongo:7.0
    container_name: roxxstar-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  audio-uploads:
  mongo-data:
